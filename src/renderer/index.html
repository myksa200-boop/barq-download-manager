<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'">
  <title>Barq Download Manager</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <nav id="menubar">
      <div class="menu-top" data-menu="tasks" data-t="m_tasks"></div>
      <div class="menu-top" data-menu="file" data-t="m_file"></div>
      <div class="menu-top" data-menu="downloads" data-t="m_downloads"></div>
      <div class="menu-top" data-menu="view" data-t="m_view"></div>
      <div class="menu-top" data-menu="help" data-t="m_help"></div>
    </nav>
    <div id="toolbar">
      <button class="tb" data-cmd="add"><i data-ic="add" data-c="#2563eb"></i><span data-t="addUrl"></span></button>
      <button class="tb" data-cmd="resume"><i data-ic="resume" data-c="#16a34a"></i><span data-t="resume"></span></button>
      <button class="tb" data-cmd="stop"><i data-ic="stop" data-c="#dc2626"></i><span data-t="stop"></span></button>
      <button class="tb" data-cmd="stopAll"><i data-ic="stopall" data-c="#dc2626"></i><span data-t="stopAll"></span></button>
      <div class="tb-sep"></div>
      <button class="tb" data-cmd="delete"><i data-ic="del" data-c="#64748b"></i><span data-t="delete"></span></button>
      <button class="tb" data-cmd="deleteCompleted"><i data-ic="delc" data-c="#64748b"></i><span data-t="deleteCompleted"></span></button>
      <div class="tb-sep"></div>
      <button class="tb" data-cmd="options"><i data-ic="opt" data-c="#64748b"></i><span data-t="options"></span></button>
      <button class="tb" data-cmd="scheduler"><i data-ic="sched" data-c="#2563eb"></i><span data-t="scheduler"></span></button>
      <button class="tb" data-cmd="startQueue"><i data-ic="startq" data-c="#2563eb"></i><span data-t="startQueue"></span></button>
      <button class="tb" data-cmd="stopQueue"><i data-ic="stopq" data-c="#2563eb"></i><span data-t="stopQueue"></span></button>
      <input id="search" class="field" type="search" data-tp="search">
    </div>
    <div id="main">
      <aside id="sidebar"><div id="tree"></div></aside>
      <section id="gridwrap">
        <table id="grid"><colgroup></colgroup><thead><tr></tr></thead><tbody></tbody></table>
        <div id="empty" class="hidden"></div>
      </section>
    </div>
    <footer id="statusbar"></footer>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
