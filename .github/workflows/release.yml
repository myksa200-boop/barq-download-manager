name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Realm native module (Windows)
        run: node -e "require('realm'); console.log('Realm', require('realm/package.json').version)"
      - run: npm run dist:win
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/Barq-Setup-*.exe
            release/Barq-Portable-*.exe
            dist-ext/barq-chromium.zip
            dist-ext/barq-firefox.zip
          generate_release_notes: true
